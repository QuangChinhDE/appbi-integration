# Alembic configuration.
#
# The URL is not written here: it comes from DATABASE_URL through
# `migrations/env.py`, so a migration can never be run against the wrong
# database because a file was copied between environments.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Timestamped, ordered filenames: a directory listing is then also a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
