[pytest]
# `-p no:cacheprovider`: the suite is pure logic and leaves no state worth
# caching, and a .pytest_cache in the repo is noise in every diff.
addopts = -q -p no:cacheprovider
testpaths = tests
# Set explicitly to silence pytest-asyncio's warning about the future default.
asyncio_default_fixture_loop_scope = function
pythonpath = .
filterwarnings =
    error::DeprecationWarning:app.*
