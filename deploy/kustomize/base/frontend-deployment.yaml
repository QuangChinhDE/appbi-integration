apiVersion: apps/v1
kind: Deployment
metadata:
  name: appbi-workflow-frontend
  namespace: appbi-workflow
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: appbi-workflow-frontend
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # Read per request by the route handlers in
            # `src/app/api/[...path]/route.ts`. Deliberately *not* a Next
            # `rewrites()` destination: with `output: 'standalone'` those are
            # serialised into the build, so this value would be frozen at
            # whatever it was during `docker build`.
            - name: API_PROXY_TARGET
              valueFrom:
                configMapKeyRef:
                  name: appbi-workflow-config
                  key: API_PROXY_TARGET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next writes its image cache here even when nothing uses it.
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
