apiVersion: apps/v1
kind: Deployment
metadata:
  name: appbi-workflow-api
  namespace: appbi-workflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: control-plane
spec:
  # Two, not one. The rate limit and idempotency are both correct across
  # replicas by design (a Postgres counter and a unique index), and running two
  # in every environment is what keeps them that way -- a property only
  # exercised in production is a property nobody has tested.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread across nodes where possible. `ScheduleAnyway`, not
      # `DoNotSchedule`: a single-node cluster should still get two pods rather
      # than one pod and one pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: appbi-workflow-api
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # The ingress terminates TLS and sets X-Forwarded-*; without this
            # every audit row records the ingress's address as the client's.
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: appbi-workflow-config
            - secretRef:
                name: appbi-workflow
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # `readOnlyRootFilesystem` needs somewhere for anything that writes
            # a temporary file.
            - name: tmp
              mountPath: /tmp
          resources:
            # A request equal to the limit for memory, so the pod is Guaranteed
            # for the resource it can be OOM-killed for. CPU is left burstable:
            # a graph compile is spiky and throttling it makes an editor feel
            # broken.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 512Mi
          startupProbe:
            # Generous: the first request migrates nothing but does open the
            # connection pool and probe the engine. A tight startup probe here
            # would restart-loop a pod that was about to be fine.
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # The shallow probe. It does *not* fail on an engine outage: taking
            # every API pod out of rotation because the engine restarted would
            # turn a degraded product into a total one (SRS 9.6).
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              # Let the ingress notice the endpoint is going away before the
              # process stops accepting. Without it a rolling update returns a
              # handful of 502s that look like a product fault.
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
